<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/tailwind.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <title>blog_cms</title>
  </head>
  <body class="bg-amber-50">
    <nav class="sticky top-0 z-50">
      <div class="h-20 flex justify-between item-center">
        <!-- Logo -->
        <div class="flex items-center">
          <h1 class="text-2xl font-mono p-4 m-2">PUCC<br />BLOG</h1>
        </div>

        <!---Right side navs-->

        <div class="flex items-center space-x-6 pr-10">
          <button
            id="publishBtn"
            class="p-2 m-2 bg-green-600 text-white text-sm rounded-md cursor-pointer"
          >
            Publish
          </button>

          <button
            id="draftBtn"
            class="p-2 m-2 bg-red-900 text-white text-sm rounded-md cursor-pointer"
          >
            Save Draft
          </button>
        </div>
      </div>
    </nav>

    <!--post option -->
    <main class="max-w-3xl mx-auto px-4 py-12">

      <!--cover image option-->

      <div class="mb-8">
        <label
          for="upload-cover"
          class="p-4 m-2 text-2xl flex gap-x-2 cursor-pointer"
        >
          <i class="fa-solid fa-circle-plus text-xl"></i>
          <span class="text-sm">Add cover image (optional)</span>
        </label>
        <input
          type="file"
          id="upload-cover"
          accept="image/png, image/jpeg, image/jpg"
          style="display: none"
        />
      </div>

      <!--title-->

      <div class="mb-6">
        <input
          type="text"
          id="post-title"
          placeholder="Title"
          class="w-full text-4xl font-serif font-bold outline-none resize-none overflow-hidden"
          maxlength="200"
        />
      </div>

      <!--content-->

      <div class="mb-8">
        <textarea
          id="post-content"
          contenteditable="true"
          class="min-h-[500px] text-xl w-full outline-none"
          placeholder="Tell your story..."
        ></textarea>
      </div>

      <!-- Character count (optional) -->
      <div class="text-right text-sm text-gray-500">
        <span id="char-count">0</span> characters
      </div>

    </main>
    
    <script type="module" src="/src/post.js"></script>
  </body>
</html>
