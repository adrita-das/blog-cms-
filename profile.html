<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind -->
    <link href="/src/tailwind.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <title>blog_cms</title>
  </head>

  <body class="bg-amber-50">
    <nav class="border-b border-black sticky top-0 z-50">
      <div class="h-20 flex justify-between items-center px-4">

        <!-- Left Side -->
        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-mono">PUCC<br />BLOG</h1>
        </div>

        <!-- Right Side -->
        <div class="flex items-center gap-6">

          <!-- Write Button -->
          <a
            href="post.html"
            class="flex items-center gap-1.5 text-gray-700 hover:text-gray-900 transition"
          >
            Write
            <i class="fa-regular fa-pen-to-square text-xl"></i>
          </a>

          <!-- Profile -->
          <div class="relative">
            <button
              id="profileBtn"
              class="w-10 h-10 rounded-full flex items-center justify-center text-white font-semibold hover:opacity-90 transition"
            >
              <span id="userInitial"></span>
            </button>

            <!-- Profile Dropdown -->
            <div
              id="profileMenu"
              class="hidden absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-xl border border-gray-200 py-2"
            >
              <div class="px-4 py-3 border-b border-gray-200">
                <p id="userEmail" class="font-semibold text-sm"></p>
                <p id="username" class="text-xs text-gray-500 mt-1"></p>
              </div>

              <a
                href="profile.html"
                class="w-full px-4 py-2 hover:bg-gray-50 flex items-center gap-3 text-sm"
              >
                <i class="fas fa-user w-4"></i>
                Profile
              </a>

              <a
                href="library.html"
                class="w-full px-4 py-2 hover:bg-gray-50 flex items-center gap-3 text-sm"
              >
                <i class="fas fa-bookmark w-4"></i>
                Library
              </a>

              <a
                href="stories.html"
                class="w-full px-4 py-2 hover:bg-gray-50 flex items-center gap-3 text-sm"
              >
                <i class="fas fa-file-alt w-4"></i>
                Stories
              </a>

              <a
                href="stats.html"
                class="w-full px-4 py-2 hover:bg-gray-50 flex items-center gap-3 text-sm"
              >
                <i class="fas fa-chart-bar w-4"></i>
                Stats
              </a>

              <div class="border-t border-gray-200 mt-2 pt-2">
                <button
                  id="signOutBtn"
                  class="w-full px-4 py-2 hover:bg-gray-50 flex items-center gap-3 text-sm text-red-600"
                >
                  <i class="fas fa-sign-out-alt w-4"></i>
                  Sign out
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </nav>

    <script type="module" src="/src/profile.js"></script>
  </body>
</html>
