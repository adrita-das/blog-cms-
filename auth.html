<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/tailwind.css" rel="stylesheet" />
    <title>blog_cms</title>
  </head>
  <body class="bg-amber-50">
    <main class="min-h-screen flex items-center justify-center px-8 py-12">
      <div class="bg-white rounded-b-lg shadow-2xl max-w-md w-full p-8">
        <!--tab buttons-->

        <div class="flex border-b border-gray-200 mb-8">
          <button
            class="flex-1 bg-black text-white text-sm p-2 m-2 rounded-md cursor-pointer"
            id="signInBtn"
          >
            Sign In
          </button>

          <button
            class="flex-1 bg-gray-200 text-gray-600 text-sm p-2 m-2 rounded-md cursor-pointer"
            id="signUpBtn"
          >
            Sign Up
          </button>
        </div>

        <!--sign in form -->

        <form class="space-y-4" id="signInForm">
          <h2 class="text-bold text-xl">Welcome Back</h2>

          <div class="space-y-4">
            <label class="text-sm font-semibold font-sans">Email</label>
            <input
              type="email" id="signInEmail"
              class="w-full border-2 border-black rounded-md px-2"
            />

            <label class="text-sm font-semibold font-sans">Password</label>
            <input
              type="password" id="signInPassword"
              class="w-full border-2 border-black rounded-md px-2"
            />
          </div>

          <button
            type="submit"
            class="flex-1 bg-black text-white text-sm p-2 m-2 rounded-md"
            id="submitBtn"
          >
            Sign In
          </button>
          <p id="signInError" class="text-red-600 text-sm hidden"></p>
        </form>

        <!---sign up form-->

        <form class="space-y-4 hidden" id="signUpForm">
          <h2 class="text-bold text-xl">JOIN PUCC BLOG</h2>

          <div class="space-y-4">
            <label class="text-sm font-semibold font-sans">Email</label>
            <input
              type="email" id="signUpEmail"
              class="w-full border-2 border-black rounded-md px-2"
            />

            <label class="text-sm font-semibold font-sans">Password</label>
            <input
              type="password" id="signUpPassword"
              class="w-full border-2 border-black rounded-md px-2"
            />


          </div>

          <button
            type="submit"
            class="flex-1 bg-black text-white text-sm p-2 m-2 rounded-md cursor-pointer"
            id="crtBtn"
          >
            Create Account
          </button>
          <p id="signUpError" class="text-red-600 text-sm hidden"></p>
          <p id="signUpSuccess" class="text-green-600 text-sm hidden"></p>
        </form>
      </div>
    </main>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
